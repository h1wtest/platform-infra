{{- $v := .Values -}}
{{- $annotations := dict -}}
{{- if $v.credentialRevision }}{{ $_ := set $annotations "sso.local/credential-revision" $v.credentialRevision }}{{ end -}}
{{- if $v.configRevision }}{{ $_ := set $annotations "sso.local/config-revision" $v.configRevision }}{{ end -}}
{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"name":{{ $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"spec":{
{{ if not $v.autoscaling }}"replicas":{{ $v.replicas }},{{ end }}
"minReadySeconds":5,"progressDeadlineSeconds":180,"selector":{"matchLabels":{"app":{{ $v.name | toJson }}}},
"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}},
"template":{"metadata":{"labels":{"app":{{ $v.name | toJson }}},"annotations":{{ $annotations | toJson }}},"spec":{
"serviceAccountName":{{ $v.name | toJson }},"automountServiceAccountToken":false,"terminationGracePeriodSeconds":50,
"securityContext":{"runAsNonRoot":true,"runAsUser":{{ $v.uid }},"runAsGroup":{{ $v.uid }},"fsGroup":{{ $v.uid }},"seccompProfile":{"type":"RuntimeDefault"}},
"containers":[{"name":{{ $v.name | toJson }},"image":{{ required "image required" $v.image | toJson }},"imagePullPolicy":"IfNotPresent",
"ports":[{{ range $index, $port := $v.ports }}{{ if $index }},{{ end }}{"containerPort":{{ $port }}}{{ end }}],
"env":{{ $v.env | toJson }},"command":{{ $v.command | toJson }},"args":{{ $v.args | toJson }},
"resources":{"requests":{"cpu":{{ $v.cpu | toJson }},"memory":{{ $v.memory | toJson }}},"limits":{"cpu":{{ $v.cpuLimit | toJson }},"memory":{{ $v.memoryLimit | toJson }}}},
"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},
"lifecycle":{"preStop":{"sleep":{"seconds":5}}},
{{ if $v.readinessPath }}
"readinessProbe":{"httpGet":{"path":{{ $v.readinessPath | toJson }},"port":{{ default (index $v.ports 0) $v.probePort }},"scheme":{{ ternary "HTTPS" "HTTP" $v.tls | toJson }}},"periodSeconds":5,"timeoutSeconds":3,"failureThreshold":3},
"livenessProbe":{"httpGet":{"path":{{ $v.livePath | toJson }},"port":{{ default (index $v.ports 0) $v.probePort }},"scheme":{{ ternary "HTTPS" "HTTP" $v.tls | toJson }}},"periodSeconds":15,"timeoutSeconds":3,"failureThreshold":4},
"startupProbe":{"httpGet":{"path":{{ $v.readinessPath | toJson }},"port":{{ default (index $v.ports 0) $v.probePort }},"scheme":{{ ternary "HTTPS" "HTTP" $v.tls | toJson }}},"periodSeconds":5,"failureThreshold":60},
{{ end }}
"volumeMounts":[{"name":"tmp","mountPath":"/tmp"}{{ range $v.mounts }},{{ . | toJson }}{{ end }}]}],
{{ if $v.databaseGate }}
"initContainers":[{"name":"verified-database-gate","image":{{ $v.postgresImage | toJson }},"command":["/bin/sh","-ec",{{ $v.databaseGateScript | toJson }}],"env":[{"name":"DATABASE_URL","valueFrom":{"secretKeyRef":{"name":{{ $v.databaseSecret | toJson }},"key":"DATABASE_URL"}}}],"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}},"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"volumeMounts":[{"name":"postgres-ca","mountPath":"/run/postgres","readOnly":true},{"name":"tmp","mountPath":"/tmp"}]}],
{{ end }}
"volumes":[{"name":"tmp","emptyDir":{"sizeLimit":"128Mi"}}{{ range $v.volumes }},{{ . | toJson }}{{ end }}],
"topologySpreadConstraints":[{"maxSkew":1,"topologyKey":"kubernetes.io/hostname","whenUnsatisfiable":"ScheduleAnyway","labelSelector":{"matchLabels":{"app":{{ $v.name | toJson }}}}}]
}}}}
---
{"apiVersion":"v1","kind":"ServiceAccount","metadata":{"name":{{ $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"automountServiceAccountToken":false}
---
{"apiVersion":"v1","kind":"Service","metadata":{"name":{{ $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"spec":{"selector":{"app":{{ $v.name | toJson }}},"ports":{{ $v.servicePorts | toJson }}}}
{{ if $v.metricsDiscovery }}
---
{"apiVersion":"v1","kind":"Service","metadata":{"name":{{ printf "%s-metrics" $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"spec":{"clusterIP":"None","publishNotReadyAddresses":false,"selector":{"app":{{ $v.name | toJson }}},"ports":[{"name":"metrics","port":{{ index $v.ports 0 }},"targetPort":{{ index $v.ports 0 }}}]}}
{{ end }}
{{ if $v.publicService }}
---
{"apiVersion":"v1","kind":"Service","metadata":{"name":"gateway-public","namespace":{{ .Release.Namespace | toJson }}},"spec":{"type":"LoadBalancer","selector":{"app":"gateway"},"ports":{{ $v.servicePorts | toJson }}}}
{{ end }}
{{ if $v.pdb }}
---
{"apiVersion":"policy/v1","kind":"PodDisruptionBudget","metadata":{"name":{{ $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"spec":{"minAvailable":1,"selector":{"matchLabels":{"app":{{ $v.name | toJson }}}}}}
{{ end }}
{{ if $v.autoscaling }}
---
{"apiVersion":"autoscaling/v2","kind":"HorizontalPodAutoscaler","metadata":{"name":{{ $v.name | toJson }},"namespace":{{ .Release.Namespace | toJson }}},"spec":{"scaleTargetRef":{"apiVersion":"apps/v1","kind":"Deployment","name":{{ $v.name | toJson }}},"minReplicas":2,"maxReplicas":4,"metrics":[{"type":"Resource","resource":{"name":"cpu","target":{"type":"Utilization","averageUtilization":70}}}],"behavior":{"scaleDown":{"stabilizationWindowSeconds":120}}}}
{{ end }}
