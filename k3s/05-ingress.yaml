apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retry
  namespace: sso-platform
spec:
  retry:
    attempts: 3
    initialInterval: 50ms
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sso-ingress
  namespace: sso-platform
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    traefik.ingress.kubernetes.io/router.middlewares: sso-platform-retry@kubernetescrd
spec:
  rules:
    - http:
        paths:
          # Identity API & OIDC routes
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8001
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8001
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8001

          # User & ЛК routes
          - path: /api/v1/users
            pathType: Prefix
            backend:
              service:
                name: user-notification-service
                port:
                  number: 8002

          # Frontend SPA fallback
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
