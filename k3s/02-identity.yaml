apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: sso-platform
  labels:
    app: identity-service
    tier: core-auth
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: sso_platform-identity-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
            - containerPort: 50051
              name: grpc
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: HTTP_PORT
            - name: GRPC_PORT
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: GRPC_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: IDENTITY_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: REDIS_URL_0
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: KAFKA_BROKERS
            - name: KAFKA_IDENTITY_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: KAFKA_IDENTITY_TOPIC
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: JWT_SECRET
            - name: OAUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: OAUTH_ISSUER
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: RUST_LOG
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 1"]
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
    - name: grpc
      port: 50051
      targetPort: 50051
