apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-notification-service
  namespace: sso-platform
  labels:
    app: user-notification-service
    tier: communication
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-notification-service
  template:
    metadata:
      labels:
        app: user-notification-service
    spec:
      containers:
        - name: user-notification-service
          image: sso_platform-user-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: USER_HTTP_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: USER_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: REDIS_URL_1
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: KAFKA_CONSUMER_GROUP
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: KAFKA_IDENTITY_TOPIC
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: sso-config
                  key: SMTP_FROM
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sso-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 1"]
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: user-notification-service
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: user-notification-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
