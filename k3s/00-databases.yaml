apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: sso-platform
data:
  init.sql: |
    CREATE DATABASE identity_db;
    GRANT ALL PRIVILEGES ON DATABASE identity_db TO postgres;
    CREATE DATABASE user_db;
    GRANT ALL PRIVILEGES ON DATABASE user_db TO postgres;
    CREATE DATABASE admin_db;
    GRANT ALL PRIVILEGES ON DATABASE admin_db TO postgres;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres_secret_pass"
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.8.3-alpine
          command: ["redis-server", "--requirepass", "redis_secret_pass"]
          ports:
            - containerPort: 6379
              name: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: sso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v26.2.5
          command:
            - /usr/bin/rpk
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:29092
            - --advertise-kafka-addr=internal://redpanda.sso-platform.svc.cluster.local:29092
            - --mode=dev-container
            - --smp=1
            - --default-log-level=warn
          ports:
            - containerPort: 29092
              name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: redpanda
  ports:
    - port: 29092
      targetPort: 29092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: sso-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
  template:
    metadata:
      labels:
        app: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.6
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: sso-platform
spec:
  type: ClusterIP
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: http
      port: 8025
      targetPort: 8025
