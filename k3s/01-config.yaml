apiVersion: v1
kind: ConfigMap
metadata:
  name: sso-config
  namespace: sso-platform
data:
  HTTP_PORT: "8001"
  GRPC_PORT: "50051"
  USER_HTTP_PORT: "8002"
  KAFKA_BROKERS: "redpanda.sso-platform.svc.cluster.local:29092"
  KAFKA_IDENTITY_TOPIC: "identity.events"
  KAFKA_CONSUMER_GROUP: "user-notification-service-group"
  SMTP_HOST: "mailpit.sso-platform.svc.cluster.local"
  SMTP_PORT: "1025"
  SMTP_FROM: "no-reply@our-sso.local"
  OAUTH_ISSUER: "http://sso.local"
  RUST_LOG: "info,identity_service=debug"
---
apiVersion: v1
kind: Secret
metadata:
  name: sso-secrets
  namespace: sso-platform
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secret_pass"
  REDIS_PASSWORD: "redis_secret_pass"
  JWT_SECRET: "super_secret_jwt_hmac_key_min_32_bytes_long_here_12345"
  IDENTITY_DATABASE_URL: "postgres://postgres:postgres_secret_pass@postgres.sso-platform.svc.cluster.local:5432/identity_db"
  USER_DATABASE_URL: "postgres://postgres:postgres_secret_pass@postgres.sso-platform.svc.cluster.local:5432/user_db?sslmode=disable"
  REDIS_URL_0: "redis://:redis_secret_pass@redis.sso-platform.svc.cluster.local:6379/0"
  REDIS_URL_1: "redis://:redis_secret_pass@redis.sso-platform.svc.cluster.local:6379/1"
