pid /tmp/nginx.pid;
worker_processes auto;
# Native nginx upstream errors embed raw URI/query; sanitized access logs and metrics are authoritative.
error_log /dev/null;
events { worker_connections 1024; }
http {
  log_format sanitized escape=json '{"method":"$request_method","uri":"$uri","status":$status,"request_id":"$request_id","duration":$request_time}';
  access_log /dev/stdout sanitized;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64k;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;
  proxy_ssl_verify on;
  proxy_ssl_server_name on;
  proxy_ssl_trusted_certificate /run/tls/ca.crt;
  proxy_ssl_verify_depth 2;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  include /run/gateway/trusted-headers.conf;
  proxy_set_header X-Request-ID $request_id;
  server { listen 8080; return 308 https://localhost:8448$request_uri; }
  # Private integration listener is never published by gateway-public. Its
  # NetworkPolicy admits only the explicit integration-ingress workload.
  server {
    listen 9443 ssl;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = /internal/v1/external-events { limit_except POST { deny all; } proxy_ssl_name profile-service; proxy_pass https://profile-service:8002; }
    location / { return 404; }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = /health/live { access_log off; return 200 'ok'; }
    location = /health/ready { access_log off; return 200 'ok'; }
    location /api/v1/auth/ { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location = /oauth/consent { proxy_pass http://frontend:80; }
    location /oauth/ { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location /.well-known/ { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location /api/v1/users/ { proxy_ssl_name profile-service; proxy_pass https://profile-service:8002; }
    location /api/v1/notifications { proxy_ssl_name notification-service; proxy_pass https://notification-service:8003; }
    location ~ ^/api/v1/admin/users/[^/]+/telegram/reset$ { proxy_ssl_name profile-service; proxy_pass https://profile-service:8002; }
    location ~ ^/api/v1/admin/users/[^/]+/(roles|sessions/revoke)(/|$) { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location /api/v1/admin/roles { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location /api/v1/admin/oauth/clients { proxy_ssl_name identity-service; proxy_pass https://identity-service:8001; }
    location /api/v1/catalog { proxy_ssl_name catalog-service; proxy_pass https://catalog-service:8006; }
    location /api/v1/admin/catalog { proxy_ssl_name catalog-service; proxy_pass https://catalog-service:8006; }
    location /api/v1/orders { proxy_ssl_name billing-service; proxy_pass https://billing-service:8007; }
    location /api/v1/payments { proxy_ssl_name billing-service; proxy_pass https://billing-service:8007; }
    location /api/v1/admin/payments { proxy_ssl_name billing-service; proxy_pass https://billing-service:8007; }
    location /api/v1/subscriptions { proxy_ssl_name subscription-service; proxy_pass https://subscription-service:8008; }
    location /api/v1/admin/subscriptions { proxy_ssl_name subscription-service; proxy_pass https://subscription-service:8008; }
    location /api/v1/referrals { proxy_ssl_name referral-service; proxy_pass https://referral-service:8009; }
    location /api/v1/admin/referrals { proxy_ssl_name referral-service; proxy_pass https://referral-service:8009; }
    location /api/v1/admin/ { proxy_ssl_name admin-audit-service; proxy_pass https://admin-audit-service:8004; }
    location = /internal/v1/telegram/webhook { limit_except POST { deny all; } proxy_ssl_name profile-service; proxy_pass https://profile-service:8002; }
    location /internal/ { return 404; }
    location = /metrics { return 404; }
    location / { proxy_pass http://frontend:80; }
  }
}
