global:
  scrape_interval: 10s
  evaluation_interval: 5s
rule_files:
  - /etc/platform/alerts.yml
scrape_configs:
  - job_name: platform
    scheme: https
    tls_config:
      ca_file: /run/tls/ca.crt
    static_configs:
      - targets: [identity-service:8001, profile-service:8002, notification-service:8003, notification-worker:8005, admin-audit-service:8004]
  - job_name: kafka
    metrics_path: /public_metrics
    static_configs:
      - targets: [redpanda-0.redpanda:9644, redpanda-1.redpanda:9644, redpanda-2.redpanda:9644]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
