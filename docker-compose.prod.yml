name: ${PROJECT_NAME:-sso_platform_prod}

services:
  # ==========================================
  # 1. PostgreSQL 18 (Private internal database)
  # ==========================================
  postgres:
    image: postgres:18-alpine
    container_name: prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: identity_db,user_db,admin_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql
      - ./scripts/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - sso_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis 8 (Private internal session cache)
  # ==========================================
  redis:
    image: redis:8.8.3-alpine
    container_name: prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - sso_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Redpanda (Private internal Kafka broker)
  # ==========================================
  redpanda:
    image: redpandadata/redpanda:v26.2.5
    container_name: prod_redpanda
    restart: always
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092
      - --advertise-kafka-addr internal://redpanda:29092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode production
      - --default-log-level=warn
    volumes:
      - redpanda_prod_data:/var/lib/redpanda/data
    networks:
      - sso_network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Identity & SSO Service (Rust)
  # ==========================================
  identity-service:
    build:
      context: ..
      dockerfile: identity-service/Dockerfile
    container_name: prod_identity_service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      HTTP_PORT: 8001
      GRPC_PORT: 50051
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/identity_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BROKERS: redpanda:29092
      KAFKA_IDENTITY_TOPIC: identity.events
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      PASSWORD_RESET_TOKEN_TTL_SECONDS: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:-900}
      OAUTH_ISSUER: ${OAUTH_ISSUER}
      RUST_LOG: warn,identity_service=info
    networks:
      - sso_network

  # ==========================================
  # 5. User & Notification Service (Go)
  # ==========================================
  user-notification-service:
    build:
      context: ..
      dockerfile: user-notification-service/Dockerfile
    container_name: prod_user_notification_service
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      HTTP_PORT: 8002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/user_db?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      KAFKA_BROKERS: redpanda:29092
      KAFKA_CONSUMER_GROUP: user-notification-service-group
      KAFKA_TOPIC: identity.events
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - sso_network

  # ==========================================
  # 6. Frontend (React SPA)
  # ==========================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: prod_frontend
    restart: always
    networks:
      - sso_network

  # ==========================================
  # 7. Edge Gateway (Reverse Proxy - ONLY Public Exposure)
  # ==========================================
  gateway:
    image: nginx:1.27-alpine
    container_name: prod_gateway
    restart: always
    depends_on:
      - identity-service
      - user-notification-service
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sso_network

networks:
  sso_network:
    name: sso_prod_network
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  redpanda_prod_data:
